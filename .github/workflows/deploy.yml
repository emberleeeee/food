name: Build and deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site from source/
        run: ./build.sh

      - name: Check the build
        run: |
          test -s site/index.html
          python3 -c "import json; d=json.load(open('site/data/recipes.json')); assert len(d['recipes'])>200, len(d['recipes']); print(len(d['recipes']), 'recipes')"

      - name: Upload site/ to IONOS over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ] || [ -z "$SFTP_PATH" ]; then
            echo "::error::Add the SFTP_HOST, SFTP_USER, SFTP_PASSWORD and SFTP_PATH secrets (see README)."; exit 1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          # Uploads new and changed files only. Nothing on the server is deleted.
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20;
            mkdir -p -f $SFTP_PATH;
            mirror --reverse --verbose --no-perms site/ $SFTP_PATH;
            bye"
